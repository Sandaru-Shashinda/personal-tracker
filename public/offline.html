<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Tracker</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f6f6f4; color: #0b0b0b; padding: 16px; text-align: center; }
      @media (prefers-color-scheme: dark) { body { background: #111110; color: #f0efec; } }
      p { color: #8a8984; }
      button { margin-top: 12px; padding: 10px 18px; border-radius: 10px; border: 0; background: #2a78d6; color: white; font-weight: 600; font-size: 15px; }
    </style>
  </head>
  <body>
    <div>
      <h1>You're offline</h1>
      <p>Reconnect to keep tracking. Your data is safe.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
